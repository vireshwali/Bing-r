[tool.uv]
managed = true
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "external_http: tests that make HTTP requests to external services (e.g. iptv-org API)",
]

[tool.coverage.run]
source = ["src/bingr"]
omit = ["*/poc/*", "*/ui/*", "*/qml_resources*"]


