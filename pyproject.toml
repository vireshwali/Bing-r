[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bingr.db" = ["alembic.ini", "alembic/versions/*.py"]

[project]
name = "Bing-r"
version = "1.4.2"
description = "A modern desktop IPTV and media player/manager application built with Python, PySide6, and Qt Quick/QML. Designed as a high-performance, desktop-native media client focused on Live TV, VOD, library management, playback, discovery, and community-style metadata/reviews."
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [
    {name = "Viresh Wali", email = "vireshwali@gmail.com"}
]
maintainers = [
    {name = "Viresh Wali", email = "vireshwali@gmail.com"}
]
keywords = [
    "iptv",
    "media-player",
    "live-tv",
    "m3u",
    "epg",
    "qt",
    "pyside6",
    "desktop"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Multimedia :: Video :: Display",
]
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "m3u8>=6.0.0",
    "mpv>=1.0.8",
    "orjson>=3.11.9",
    "pyside6-ds>=4.7",
    "pyside6-essentials>=6.11.1",
    "python-dotenv>=1.1.0",
    "sqlalchemy[asyncio]>=2.0.51",
]

[project.urls]
Homepage = "https://github.com/vireshwali/Bing-r"
Repository = "https://github.com/vireshwali/Bing-r"
Issues = "https://github.com/vireshwali/Bing-r/issues"
Discussions = "https://github.com/vireshwali/Bing-r/discussions"
Changelog = "https://github.com/vireshwali/Bing-r/releases"

[project.gui-scripts]
bingr = "bingr.main:main"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
    "patchelf>=0.17.2.4",
    "zstandard>=0.25.0",
    "nuitka[onefile]>=4.1.3",
    "flatpak-pip-generator>=2026.5.28",
]

