# AARK AzureOptics - Ruff Configuration
# Source of Truth for all formatting, linting, and code standards

# ============================================================================
# TOP-LEVEL SETTINGS (apply to both linting and formatting)
# ============================================================================

line-length = 120
indent-width = 4
target-version = "py312"

# Directories to exclude
exclude = [
    ".history",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# ============================================================================
# FORMAT SECTION (formatter-specific rules)
# ============================================================================

[format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"


# ============================================================================
# LINT SECTION (linter-specific rules)
# ============================================================================

[lint]
select = [
    "E4", "E7", "E9",      # pycodestyle errors
    "F",                    # pyflakes - undefined names, unused imports
    "W",                    # pycodestyle warnings
    "B",                    # flake8-bugbear - common bugs
    "I",                    # isort - import sorting
    "C901",                 # mccabe - cyclomatic complexity
    "UP",                   # pyupgrade - upgrade syntax
    "RUF",                  # ruff-specific rules
]

# Per-file rule overrides
[lint.extend-per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*.py" = ["D"]
"**/conftest.py" = ["D"]

ignore = [
    "E501",    # Line too long - handled by formatter
    "D100",    # Missing module docstring
    "D104",    # Missing package docstring
    "B008",    # Function call in default argument
]

