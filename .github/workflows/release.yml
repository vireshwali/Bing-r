name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (x.y.z, e.g. 1.6.0 — no v prefix, numbers only)'
        required: true
        type: string
      codename:
        description: 'Codename (e.g., Hangul)'
        required: true
        type: string

# This workflow MUST be run from the main branch.
# It creates a release branch, generates all release artifacts,
# and creates a tagged GitHub release.
#
# secrets.GITHUB_TOKEN is provided automatically by GitHub — no setup needed.

jobs:
  pre-validations:
    name: Pre-Validations
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.compute.outputs.branch_name }}
      tag_name: ${{ steps.compute.outputs.tag_name }}
      version: ${{ steps.compute.outputs.version }}
      codename: ${{ steps.compute.outputs.codename }}
      release_name: ${{ steps.compute.outputs.release_name }}
    steps:
      - name: Ensure running on main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::This workflow can only be run from the main branch."
            exit 1
          fi

      - name: Validate input format
        run: |
          VERSION="${{ inputs.version }}"
          CODENAME="${{ inputs.codename }}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format. Expected x.y.z with no v prefix (e.g. 1.6.0)"
            exit 1
          fi

          if [[ "$CODENAME" =~ [[:space:]] ]]; then
            echo "::error::Codename must be a single word with no spaces."
            exit 1
          fi

          if [[ ! "$CODENAME" =~ ^[a-zA-Z0-9-]+$ ]]; then
            echo "::error::Invalid codename. Only alphanumeric characters and hyphens allowed."
            exit 1
          fi

      - name: Verify CI is passing on main
        run: |
          RUN_INFO=$(gh run list --repo "${{ github.repository }}" --branch main --workflow ci.yml --limit 1 \
            --json status,conclusion,headSha --jq '.[0]')

          if [ -z "$RUN_INFO" ] || [ "$RUN_INFO" = "null" ]; then
            echo "::error::No CI runs found on main. Run CI at least once before releasing."
            exit 1
          fi

          STATUS=$(echo "$RUN_INFO" | jq -r '.status')
          CONCLUSION=$(echo "$RUN_INFO" | jq -r '.conclusion')
          SHA=$(echo "$RUN_INFO" | jq -r '.headSha')

          echo "Latest CI run on main: $SHA"
          echo "Status: $STATUS | Conclusion: $CONCLUSION"

          if [ "$STATUS" != "completed" ]; then
            echo "::error::CI is still running on main. Wait for it to complete before releasing."
            exit 1
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI is not passing on main (conclusion: $CONCLUSION). Fix CI before releasing."
            exit 1
          fi

          echo "CI is passing on main"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing tag
        run: |
          VERSION="${{ inputs.version }}"
          CODENAME="$(echo "${{ inputs.codename }}" | tr '[:upper:]' '[:lower:]' | sed 's/./\U&/')"
          TAG="v${VERSION}-${CODENAME}"

          EXISTING=$(gh api --repo "${{ github.repository }}" "repos/${{ github.repository }}/git/ref/tags/${TAG}" 2>&1 || true)
          if echo "$EXISTING" | grep -q '"ref"'; then
            echo "::error::Tag $TAG already exists. Use a different version or codename."
            exit 1
          fi
          echo "Tag $TAG is available"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing release branch
        run: |
          VERSION="${{ inputs.version }}"
          CODENAME="$(echo "${{ inputs.codename }}" | tr '[:upper:]' '[:lower:]' | sed 's/./\U&/')"
          BRANCH="release/v${VERSION}-${CODENAME}"

          EXISTING=$(gh api --repo "${{ github.repository }}" "repos/${{ github.repository }}/branches/${BRANCH}" 2>&1 || true)
          if echo "$EXISTING" | grep -q '"name"'; then
            echo "::error::Branch $BRANCH already exists. Please delete it first."
            exit 1
          fi
          echo "Branch $BRANCH is available"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute outputs
        id: compute
        run: |
          VERSION="${{ inputs.version }}"
          CODENAME="$(echo "${{ inputs.codename }}" | tr '[:upper:]' '[:lower:]' | sed 's/./\U&/')"
          echo "branch_name=release/v${VERSION}-${CODENAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${VERSION}-${CODENAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "codename=${CODENAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=Release v${VERSION}-${CODENAME}" >> "$GITHUB_OUTPUT"

  create-release-branch:
    name: Create Release Branch
    needs: [pre-validations]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create and push release branch
        run: |
          BRANCH="${{ needs.pre-validations.outputs.branch_name }}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          echo "Created and pushed branch: $BRANCH"

  update-version:
    name: Update Version
    needs: [pre-validations, create-release-branch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pre-validations.outputs.branch_name }}

      - name: Update __init__.py
        run: |
          VERSION="${{ needs.pre-validations.outputs.version }}"
          CODENAME="${{ needs.pre-validations.outputs.codename }}"
          FILE="src/bingr/__init__.py"
          sed -i "s/__version__ = \".*\"/__version__ = \"${VERSION}\"/" "$FILE"
          sed -i "s/__codename__ = \".*\"/__codename__ = \"${CODENAME}\"/" "$FILE"
          echo "Updated $FILE:"
          grep "__version__\|__codename__" "$FILE"

      - name: Commit and push
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          VERSION="${{ needs.pre-validations.outputs.version }}"
          CODENAME="${{ needs.pre-validations.outputs.codename }}"
          git add src/bingr/__init__.py
          if git diff --cached --quiet; then
            echo "__init__.py unchanged — skipping commit"
          else
            git commit -m "Release v${VERSION}-${CODENAME}: update version"
            git pull --rebase origin "${{ needs.pre-validations.outputs.branch_name }}"
            git push
          fi

  generate-flatpak-deps:
    name: Generate Flatpak Dependencies
    needs: [pre-validations, create-release-branch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pre-validations.outputs.branch_name }}

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Sdk//6.11

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Generate flatpak requirements.txt
        run: ./scripts/generate-flatpak-deps.sh

      - name: Generate pypi-dependencies.yaml
        run: |
          # Fix dconf permission issue in CI
          sudo mkdir -p /run/user/$(id -u)
          sudo chown -R $(id -u):$(id -g) /run/user/$(id -u)
          mkdir -p /run/user/$(id -u)/dconf

          .venv/bin/python3 .venv/lib/python3.12/site-packages/flatpak_pip_generator/__main__.py \
            --yaml \
            --requirements-file flatpak/requirements.txt \
            --output flatpak/pypi-dependencies \
            --ignore-pkg 'PySide6,pyside6,pyside6-addons,pyside6-essentials,shiboken6' \
            --prefer-wheels 'pyside6-ds,lxml,orjson,greenlet,markupsafe,mpv,sqlalchemy,alembic,pyside6,pyside6-addons,pyside6-essentials,shiboken6' \
            --wheel-arches x86_64 \
            --runtime 'org.kde.Sdk//6.11'

      - name: Commit and push
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          VERSION="${{ needs.pre-validations.outputs.version }}"
          CODENAME="${{ needs.pre-validations.outputs.codename }}"
          git add flatpak/requirements.txt flatpak/pypi-dependencies.yaml
          if git diff --cached --quiet; then
            echo "Flatpak deps unchanged — skipping commit"
          else
            git commit -m "Release v${VERSION}-${CODENAME}: generate flatpak dependencies"
            git pull --rebase origin "${{ needs.pre-validations.outputs.branch_name }}"
            git push
          fi

  compile-qrc:
    name: Compile QRC Resources
    needs: [pre-validations, create-release-branch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pre-validations.outputs.branch_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Compile QRC resources
        run: |
          .venv/bin/pyside6-rcc src/bingr/qml_resources.qrc -o src/bingr/qml_resources.py
          echo "Compiled QRC resources"

      - name: Commit and push
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          VERSION="${{ needs.pre-validations.outputs.version }}"
          CODENAME="${{ needs.pre-validations.outputs.codename }}"
          git add src/bingr/qml_resources.py
          if git diff --cached --quiet; then
            echo "qml_resources.py unchanged — skipping commit"
          else
            git commit -m "Release v${VERSION}-${CODENAME}: compile QRC resources"
            git pull --rebase origin "${{ needs.pre-validations.outputs.branch_name }}"
            git push
          fi

  post-validations:
    name: Post-Validations
    needs: [pre-validations, update-version, generate-flatpak-deps, compile-qrc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pre-validations.outputs.branch_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Sanity check generated files
        run: |
          ERRORS=0
          VERSION="${{ needs.pre-validations.outputs.version }}"

          CURRENT=$(grep -oP '__version__ = "\K[^"]+' src/bingr/__init__.py)
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "::error::Version mismatch: expected $VERSION, got $CURRENT"
            ERRORS=$((ERRORS + 1))
          else
            echo "__init__.py version: $CURRENT — OK"
          fi

          DEPS=$(grep -cE '^[a-zA-Z0-9_.-]+==' flatpak/requirements.txt || true)
          if [ "$DEPS" -lt 1 ]; then
            echo "::error::flatpak/requirements.txt has no dependencies"
            ERRORS=$((ERRORS + 1))
          else
            echo "requirements.txt: $DEPS dependencies — OK"
          fi

          if [ ! -s flatpak/pypi-dependencies.yaml ]; then
            echo "::error::flatpak/pypi-dependencies.yaml is missing or empty"
            ERRORS=$((ERRORS + 1))
          else
            echo "pypi-dependencies.yaml: $(wc -l < flatpak/pypi-dependencies.yaml) lines — OK"
          fi

          if [ ! -s src/bingr/qml_resources.py ]; then
            echo "::error::src/bingr/qml_resources.py is missing or empty"
            ERRORS=$((ERRORS + 1))
          else
            echo "qml_resources.py: $(wc -l < src/bingr/qml_resources.py) lines — OK"
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Sanity check failed. $ERRORS check(s) failed."
            exit 1
          fi

          echo "All sanity checks passed"

      - name: Run lint check
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

  tag-and-release:
    name: Tag and Release
    needs: [pre-validations, post-validations]
    #if: ${{ false }} # disabled for now — remove this line to enable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pre-validations.outputs.branch_name }}
          fetch-depth: 0

      - name: Create tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          TAG="${{ needs.pre-validations.outputs.tag_name }}"
          VERSION="${{ needs.pre-validations.outputs.version }}"
          CODENAME="${{ needs.pre-validations.outputs.codename }}"
          git tag -a "$TAG" -m "Release v${VERSION}-${CODENAME}"
          echo "Created tag: $TAG"

      - name: Push tag
        run: |
          git push origin "${{ needs.pre-validations.outputs.tag_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ needs.pre-validations.outputs.tag_name }}"
          name: "${{ needs.pre-validations.outputs.release_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false

  update-flatpak-manifest:
    name: Update Flatpak Manifest
    needs: [pre-validations, tag-and-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pre-validations.outputs.branch_name }}
          fetch-depth: 0

      - name: Update manifest with tag and commit hash
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          TAG="${{ needs.pre-validations.outputs.tag_name }}"
          HASH=$(git rev-parse "$TAG")
          MANIFEST="flatpak/io.github.vireshwali.Bing-r.yml"

          echo "Tag: $TAG"
          echo "Hash: $HASH"

          sed -i "s|tag: .*|tag: ${TAG}|" "$MANIFEST"
          sed -i "s|commit: .*|commit: ${HASH}|" "$MANIFEST"

          echo "Updated manifest:"
          grep -E '^\s+(tag|commit):' "$MANIFEST"

      - name: Update metainfo.xml with new release
        run: |
          VERSION="${{ needs.pre-validations.outputs.version }}"
          TAG="${{ needs.pre-validations.outputs.tag_name }}"
          DATE=$(date -u +%Y-%m-%d)
          METAINFO="flatpak/io.github.vireshwali.Bing-r.metainfo.xml"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          sed -i "/<releases>/a\\    <release version=\"${VERSION}\" date=\"${DATE}\">\n      <description>\n        <p>${RELEASE_URL}</p>\n      </description>\n    </release>" "$METAINFO"

          echo "Updated metainfo.xml:"
          grep -A 5 '<releases>' "$METAINFO"

      - name: Commit and push
        run: |
          git add flatpak/io.github.vireshwali.Bing-r.yml flatpak/io.github.vireshwali.Bing-r.metainfo.xml
          if git diff --cached --quiet; then
            echo "Flatpak files unchanged — skipping commit"
          else
            git commit -m "Release ${{ needs.pre-validations.outputs.tag_name }}: update Flatpak manifest and metainfo"
            git push
          fi

  flatpak-build-verify:
    name: Verify Flatpak Build
    needs: [pre-validations, update-flatpak-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pre-validations.outputs.branch_name }}

      - name: Install Flatpak and Builder
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Sdk//6.11 org.kde.Platform//6.11

      - name: Run Flatpak build
        run: |
          # Fix dconf permission issue in CI
          sudo mkdir -p /run/user/$(id -u)
          sudo chown -R $(id -u):$(id -g) /run/user/$(id -u)
          mkdir -p /run/user/$(id -u)/dconf

          mkdir flatpak_bingr_build && cd flatpak_bingr_build

          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.autocrlf GIT_CONFIG_VALUE_0=false \
          flatpak run --command=flathub-build org.flatpak.Builder --install \
          ../flatpak/io.github.vireshwali.Bing-r.yml

      - name: Verify build artifacts
        run: |
          ERRORS=0
          TAG="${{ needs.pre-validations.outputs.tag_name }}"
          VERSION="${{ needs.pre-validations.outputs.version }}"

          echo "=== Build Verification ==="
          echo "Tag: $TAG"
          echo "Version: $VERSION"
          echo "Workign Dir: $(pwd)"
          echo ""

          cd ..

          if [ ! -d "flatpak_bingr_build" ]; then
            echo "::error::Build directory flatpak_bingr_build does not exist"
            exit 1
          fi
          echo "Build directory exists — OK"

          if [ -f "flatpak_bingr_build/bingr" ]; then
            echo "Binary: flatpak_bingr_build/bingr — OK"
          else
            echo "::error::Binary not found at flatpak_bingr_build/bingr"
            ERRORS=$((ERRORS + 1))
          fi

          DESKTOP=$(find flatpak_bingr_build -name "*.desktop" | head -1)
          if [ -n "$DESKTOP" ]; then
            echo "Desktop file: $DESKTOP — OK"
          else
            echo "::error::Desktop file not found in build output"
            ERRORS=$((ERRORS + 1))
          fi

          METAINFO=$(find flatpak_bingr_build -name "*.metainfo.xml" | head -1)
          if [ -n "$METAINFO" ]; then
            echo "Metainfo: $METAINFO — OK"
            if grep -q "version=\"${VERSION}\"" "$METAINFO"; then
              echo "Metainfo version $VERSION — OK"
            else
              echo "::warning::Metainfo does not contain version $VERSION"
            fi
          else
            echo "::error::Metainfo XML not found in build output"
            ERRORS=$((ERRORS + 1))
          fi

          echo ""
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Build verification failed. $ERRORS check(s) failed."
            exit 1
          fi

          echo "Build verification passed"
