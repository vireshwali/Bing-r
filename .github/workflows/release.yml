name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (x.y.z, e.g. 1.6.0 — no v prefix, numbers only)'
        required: true
        type: string
      codename:
        description: 'Codename (e.g., Hangul)'
        required: true
        type: string

# This workflow MUST be run from the main branch.
# It creates a release branch, generates all release artifacts,
# and creates a tagged GitHub release.
#
# secrets.GITHUB_TOKEN is provided automatically by GitHub — no setup needed.

jobs:
  pre-validations:
    name: Pre-Validations
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.compute.outputs.branch_name }}
      tag_name: ${{ steps.compute.outputs.tag_name }}
      version: ${{ steps.compute.outputs.version }}
      codename: ${{ steps.compute.outputs.codename }}
    steps:
      - name: Ensure running on main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::This workflow can only be run from the main branch."
            exit 1
          fi

      - name: Validate input format
        run: |
          VERSION="${{ inputs.version }}"
          CODENAME="${{ inputs.codename }}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format. Expected x.y.z with no v prefix (e.g. 1.6.0)"
            exit 1
          fi

          if [[ ! "$CODENAME" =~ ^[a-zA-Z0-9-]+$ ]]; then
            echo "::error::Invalid codename. Only alphanumeric characters and hyphens allowed."
            exit 1
          fi

      - name: Verify CI is passing on main
        run: |
          RUN_INFO=$(gh run list --branch main --workflow ci.yml --limit 1 \
            --json status,conclusion,headSha --jq '.[0]')

          if [ -z "$RUN_INFO" ] || [ "$RUN_INFO" = "null" ]; then
            echo "::error::No CI runs found on main. Run CI at least once before releasing."
            exit 1
          fi

          STATUS=$(echo "$RUN_INFO" | jq -r '.status')
          CONCLUSION=$(echo "$RUN_INFO" | jq -r '.conclusion')
          SHA=$(echo "$RUN_INFO" | jq -r '.headSha')

          echo "Latest CI run on main: $SHA"
          echo "Status: $STATUS | Conclusion: $CONCLUSION"

          if [ "$STATUS" != "completed" ]; then
            echo "::error::CI is still running on main. Wait for it to complete before releasing."
            exit 1
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI is not passing on main (conclusion: $CONCLUSION). Fix CI before releasing."
            exit 1
          fi

          echo "CI is passing on main"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing tag
        run: |
          VERSION="${{ inputs.version }}"
          CODENAME="${{ inputs.codename }}"
          TAG="v${VERSION}-${CODENAME}"

          EXISTING=$(gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" 2>&1 || true)
          if echo "$EXISTING" | grep -q '"ref"'; then
            echo "::error::Tag $TAG already exists. Use a different version or codename."
            exit 1
          fi
          echo "Tag $TAG is available"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute outputs
        id: compute
        run: |
          VERSION="${{ inputs.version }}"
          CODENAME="${{ inputs.codename }}"
          echo "branch_name=release/${VERSION}-${CODENAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${VERSION}-${CODENAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "codename=${CODENAME}" >> "$GITHUB_OUTPUT"

  create-release-branch:
    name: Create Release Branch
    needs: [pre-validations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create and push release branch
        run: |
          BRANCH="${{ needs.pre-validations.outputs.branch_name }}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          echo "Created and pushed branch: $BRANCH"

  update-version:
    name: Update Version
    needs: [pre-validations, create-release-branch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pre-validations.outputs.branch_name }}

      - name: Update __init__.py
        run: |
          VERSION="${{ needs.pre-validations.outputs.version }}"
          CODENAME="${{ needs.pre-validations.outputs.codename }}"
          FILE="src/bingr/__init__.py"
          sed -i "s/__version__ = \".*\"/__version__ = \"${VERSION}\"/" "$FILE"
          sed -i "s/__codename__ = \".*\"/__codename__ = \"${CODENAME}\"/" "$FILE"
          echo "Updated $FILE:"
          grep "__version__\|__codename__" "$FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ needs.pre-validations.outputs.version }}"
          CODENAME="${{ needs.pre-validations.outputs.codename }}"
          git add src/bingr/__init__.py
          git commit -m "Release v${VERSION}-${CODENAME}: update version"
          git push

  generate-requirements:
    name: Generate Requirements
    needs: [pre-validations, update-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pre-validations.outputs.branch_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Generate flatpak requirements.txt
        run: ./scripts/generate-flatpak-deps.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ needs.pre-validations.outputs.version }}"
          CODENAME="${{ needs.pre-validations.outputs.codename }}"
          git add flatpak/requirements.txt
          git commit -m "Release v${VERSION}-${CODENAME}: generate requirements.txt"
          git push

  generate-pypi-deps:
    name: Generate PyPI Dependencies
    needs: [pre-validations, generate-requirements]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pre-validations.outputs.branch_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Generate pypi-dependencies.yaml
        run: |
          .venv/bin/python3 .venv/lib/python3.12/site-packages/flatpak_pip_generator/__main__.py \
            --yaml \
            --requirements-file flatpak/requirements.txt \
            --output flatpak/pypi-dependencies \
            --ignore-pkg 'PySide6,pyside6,pyside6-addons,pyside6-essentials,shiboken6' \
            --prefer-wheels 'pyside6-ds,lxml,orjson,greenlet,markupsafe,mpv,sqlalchemy,alembic,pyside6,pyside6-addons,pyside6-essentials,shiboken6' \
            --wheel-arches x86_64 \
            --runtime 'org.kde.Sdk//6.11'

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ needs.pre-validations.outputs.version }}"
          CODENAME="${{ needs.pre-validations.outputs.codename }}"
          git add flatpak/pypi-dependencies.yaml
          git commit -m "Release v${VERSION}-${CODENAME}: generate pypi-dependencies.yaml"
          git push

  compile-qrc:
    name: Compile QRC Resources
    needs: [pre-validations, generate-pypi-deps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pre-validations.outputs.branch_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Compile QRC resources
        run: |
          .venv/bin/pyside6-rcc src/bingr/qml_resources.qrc -o src/bingr/qml_resources.py
          echo "Compiled QRC resources"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ needs.pre-validations.outputs.version }}"
          CODENAME="${{ needs.pre-validations.outputs.codename }}"
          git add src/bingr/qml_resources.py
          git commit -m "Release v${VERSION}-${CODENAME}: compile QRC resources"
          git push

  post-validations:
    name: Post-Validations
    needs: [pre-validations, compile-qrc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pre-validations.outputs.branch_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Sanity check generated files
        run: |
          ERRORS=0

          DEPS=$(grep -cE '^[a-zA-Z0-9_.-]+==' flatpak/requirements.txt || true)
          if [ "$DEPS" -lt 1 ]; then
            echo "::error::flatpak/requirements.txt has no dependencies"
            ERRORS=$((ERRORS + 1))
          else
            echo "requirements.txt: $DEPS dependencies"
          fi

          if [ ! -s flatpak/pypi-dependencies.yaml ]; then
            echo "::error::flatpak/pypi-dependencies.yaml is missing or empty"
            ERRORS=$((ERRORS + 1))
          else
            echo "pypi-dependencies.yaml: $(wc -l < flatpak/pypi-dependencies.yaml) lines"
          fi

          if [ ! -s src/bingr/qml_resources.py ]; then
            echo "::error::src/bingr/qml_resources.py is missing or empty"
            ERRORS=$((ERRORS + 1))
          else
            echo "qml_resources.py: $(wc -l < src/bingr/qml_resources.py) lines"
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Sanity check failed. $ERRORS file(s) are invalid."
            exit 1
          fi

          echo "All generated files look good"

      - name: Run lint check
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

  tag-and-release:
    name: Tag and Release
    needs: [pre-validations, post-validations]
    if: ${{ false }} # disabled for now — remove this line to enable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pre-validations.outputs.branch_name }}
          fetch-depth: 0

      - name: Create tag
        run: |
          TAG="${{ needs.pre-validations.outputs.tag_name }}"
          VERSION="${{ needs.pre-validations.outputs.version }}"
          CODENAME="${{ needs.pre-validations.outputs.codename }}"
          git tag -a "$TAG" -m "Release v${VERSION}-${CODENAME}"
          echo "Created tag: $TAG"

      - name: Push tag
        run: |
          git push origin "${{ needs.pre-validations.outputs.tag_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ needs.pre-validations.outputs.tag_name }}"
          name: "Release ${{ needs.pre-validations.outputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
