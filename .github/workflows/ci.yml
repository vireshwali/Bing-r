name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# TODO: Enable branch protection — require lint, typecheck, test, and
# flatpak-build to pass before merging to main.  Keep all checks
# non-blocking for now while the project is ramping up.

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff --verbose check .

      # - name: Ruff format check
      #   run: uv run ruff format --check .

